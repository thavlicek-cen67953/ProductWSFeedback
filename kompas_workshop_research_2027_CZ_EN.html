function renderOptions(){for(const [id,kind,opts] of questions){if(kind==='text')continue;const container=document.getElementById(id+'options');const old=[...container.querySelectorAll('input:checked')].map(x=>x.value);container.innerHTML=opts.map(([value,cz,en])=>`<label class="option"><input type="${kind==='radio'?'radio':'checkbox'}" name="${id}" value="${value}" ${old.includes(value)?'checked':''}><span>${lang==='cz'?cz:en}</span></label>`).join('');if(kind==='multi3'){container.querySelectorAll('input').forEach(x=>x.addEventListener('change',()=>{if(container.querySelectorAll('input:checked').length>3){x.checked=false;document.getElementById('limitError').style.display='block'}else document.getElementById('limitError').style.display='none'}))}}}
function setLang(l){lang=l;document.documentElement.lang=l==='cz'?'cs':'en';document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=tr[l][el.dataset.i]||''});document.querySelectorAll('[data-ph]').forEach(el=>{el.placeholder=tr[l][el.dataset.ph]||''});document.getElementById('journey').innerHTML=tr[l].steps.map((v,i)=>`<div>${String(i+1).padStart(2,'0')} · ${v}</div>`).join('');document.getElementById('sidepoints').innerHTML=[1,2,3,4].map(i=>`<div class="disc"><span class="dot"></span><span>${tr[l]['side'+i]}</span></div>`).join('');document.getElementById('metrics').innerHTML=tr[l].metrics.map((v,i)=>`<div class="metric"><span>${v}</span><strong>${['Q3','Q4','Q5–8','Q9–11'][i]}</strong></div>`).join('');document.getElementById('discussion').innerHTML=[1,2,3,4].map(i=>`<div class="teamcard"><h3>${tr[l]['d'+i]}</h3><p>${tr[l]['d'+i+'p']}</p></div>`).join('');document.querySelectorAll('.langs button').forEach(el=>el.classList.toggle('active',el.id==='lang-'+l));renderOptions();document.getElementById('answer').classList.add('hidden')}
function showSummary(){const data=new FormData(document.getElementById('survey'));const lines=questions.map(([id,kind,opts],i)=>{let value;if(kind==='text')value=data.get(id)||'—';else value=data.getAll(id).map(v=>{const found=opts.find(opt=>opt[0]===v);return found?(lang==='cz'?found[1]:found[2]):v}).join('; ')||'—';return `${i+1}. ${tr[lang][id]}\n${value}`});const box=document.getElementById('answer');box.textContent=tr[lang].summarytitle+'\n\n'+lines.join('\n\n');box.classList.remove('hidden');box.scrollIntoView({behavior:'smooth',block:'nearest'})}
